# Dev cluster (namespace live), applied by the Jenkinsfile on develop after
# values.yaml. Host names follow the livestock registry's dev deployment; see
# docs/deployment.md before the first deploy (DNS, nginx site, IAM cookie
# domain).
publicUrl: https://livestock-registry-dashboard-development.oanstaging.com

ingress:
  public:
    enabled: true
    host: livestock-registry-dashboard-development.oanstaging.com

iam:
  # live's IAM signs staff in through its own Keycloak (login provider 2).
  loginProviderId: "2"
  # Must equal the IAM's AUTH_COOKIE_DOMAIN, and publicUrl must sit under it.
  cookieDomain: .oanstaging.com

oidc:
  logoutUrl: https://keycloak-livestock-development.oanstaging.com/realms/staff/protocol/openid-connect/logout
  clientId: livestock-registry-staff-portal

keycloakSetup:
  realm: staff
  grantUsers: [admin, nina.patel]

links:
  registryPortalUrl: https://livestock-registry-development.oanstaging.com
