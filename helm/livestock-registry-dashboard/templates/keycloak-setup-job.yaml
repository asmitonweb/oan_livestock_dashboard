{{- /*
Keycloak side of the dashboard, after every install and upgrade (before the
IAM registration hook, which logs in as this client). Idempotent:
  - a confidential client access.clientId with a service account and no login
    flows of its own (users sign in through IAM), its secret taken from the
    client Secret;
  - its client role access.role. IAM enables the staff-portal tile, and the
    dashboard admits a user, only when the token carries it;
  - the role for each existing user in keycloakSetup.grantUsers (anyone else
    is granted it in the Keycloak admin console).
Runs kcadm with the Keycloak admin credentials from keycloakSetup.adminSecret.
*/ -}}
{{- if .Values.keycloakSetup.enabled }}
{{- $ks := .Values.keycloakSetup }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dashboard.fullname" . }}-keycloak-setup
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-keycloak-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "dashboard.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: keycloak-setup
          image: {{ $ks.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KC=/opt/keycloak/bin/kcadm.sh
              export HOME=/tmp
              $KC config credentials --server "$KEYCLOAK_URL" --realm master \
                --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null
              cid() { $KC get clients -r "$REALM" -q clientId="$CLIENT" --fields id --format csv --noquotes | head -1; }
              if [ -z "$(cid)" ]; then
                $KC create clients -r "$REALM" -s clientId="$CLIENT" -s enabled=true -s publicClient=false \
                  -s secret="$CLIENT_SECRET" -s serviceAccountsEnabled=true -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false -s "description=Registry dashboard: access role + IAM registration" >/dev/null
                echo "created client $CLIENT"
              else
                $KC update "clients/$(cid)" -r "$REALM" -s secret="$CLIENT_SECRET" -s serviceAccountsEnabled=true >/dev/null
              fi
              ID=$(cid)
              # List and match: the role name may contain spaces.
              $KC get "clients/$ID/roles" -r "$REALM" --fields name --format csv --noquotes | grep -qxF "$ROLE" \
                || $KC create "clients/$ID/roles" -r "$REALM" -s name="$ROLE" \
                     -s "description=Can open the registry dashboard (aggregate figures only)" >/dev/null
              for user in $GRANT_USERS; do
                if [ -n "$($KC get users -r "$REALM" -q username="$user" -q exact=true --fields id --format csv --noquotes | head -1)" ]; then
                  $KC add-roles -r "$REALM" --uusername "$user" --cclientid "$CLIENT" --rolename "$ROLE" >/dev/null
                  echo "granted '$ROLE' to $user"
                else
                  echo "user $user not found in realm $REALM; skipped"
                fi
              done
              echo "[$REALM] $CLIENT: role '$ROLE' ready"
          env:
            - name: KEYCLOAK_URL
              value: {{ required "keycloakSetup.url is required" $ks.url | quote }}
            - name: REALM
              value: {{ required "keycloakSetup.realm is required" $ks.realm | quote }}
            - name: KEYCLOAK_ADMIN
              value: {{ $ks.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ks.adminSecret.name }}
                  key: {{ $ks.adminSecret.key }}
            - name: CLIENT
              value: {{ .Values.access.clientId | quote }}
            - name: ROLE
              value: {{ .Values.access.role | quote }}
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard.clientSecretName" . }}
                  key: {{ .Values.iamRegister.clientSecret.key }}
            - name: GRANT_USERS
              value: {{ join " " $ks.grantUsers | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
{{- end }}
