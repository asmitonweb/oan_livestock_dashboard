name: CI

on:
  pull_request:
  push:
    branches: [develop, main]   # staging: not wired yet

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        # No cluster here, so the IAM cookie domain lookup is given explicitly.
        run: |
          chart=$(ls -d helm/*/ | head -1)
          args="--set image.repository=123456789012.dkr.ecr.ap-south-1.amazonaws.com/ci --set image.tag=ci --set environment=development --set iam.cookieDomain=.example.org"
          helm lint "$chart" $args
          helm template ci "$chart" $args > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dashboard:ci .
