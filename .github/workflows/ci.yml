name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart (dev values)
        run: |
          chart=$(ls -d helm/*/ | head -1)
          args="--set image.repository=123456789012.dkr.ecr.ap-south-1.amazonaws.com/ci --set image.tag=ci"
          helm lint "$chart" -f "$chart/values-dev.yaml" $args
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dashboard:ci .
